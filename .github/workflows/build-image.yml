name: Build and Push Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ubuntu:26.04 \
            -t ghcr.io/${{ github.repository_owner }}/ubuntu:resolute \
            -t ghcr.io/${{ github.repository_owner }}/ubuntu:latest \
            .

      - name: Push Docker image
        run: |
          docker push --all-tags ghcr.io/${{ github.repository_owner }}/ubuntu
